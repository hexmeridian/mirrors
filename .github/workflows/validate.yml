name: Validate

on:
  push:
    paths: [domains.json, scripts/**]
  pull_request:
    paths: [domains.json, scripts/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/domains.mjs validate
