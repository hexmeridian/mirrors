name: Manage domains

on:
  workflow_dispatch:
    inputs:
      action:
        description: Действие
        type: choice
        options: [add, remove]
        required: true
      domain:
        description: Домен, например example.com
        type: string
        required: true
      position:
        description: Куда добавить (только для add)
        type: choice
        options: [last, first]
        default: last

# Two runs at once would race on domains.json.
concurrency:
  group: domains
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Inputs go through env, not ${{ }} in run: prevents shell injection via the form.
      - name: Apply
        env:
          ACTION: ${{ inputs.action }}
          DOMAIN: ${{ inputs.domain }}
          POSITION: ${{ inputs.position }}
        run: |
          if [ "$ACTION" = add ]; then
            node scripts/domains.mjs add "$DOMAIN" "$POSITION"
          else
            node scripts/domains.mjs remove "$DOMAIN"
          fi

      - name: Commit
        env:
          ACTION: ${{ inputs.action }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.json
          git commit -m "$ACTION $DOMAIN" -m "Requested by @$GITHUB_ACTOR"
          git push

      # jsDelivr caches branch refs for up to 12h; purge so clients see the change in minutes.
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/domains.json"
